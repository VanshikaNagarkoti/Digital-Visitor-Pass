<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Visitor Registration</title>
</head>

<body>

    <h1>College Visitor Registration</h1>

    <form id="visitorForm">

        <label for="name">Visitor Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <br><br>
  
        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>

        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" placeholder="Enter your address"></textarea>

        <br><br>

        <label for="purpose">Purpose of Visit:</label><br>
        <input type="text" id="purpose" name="purpose" placeholder="Enter purpose of visit" required>

        <br><br>

        <label for="person">Person to Meet:</label><br>
        <input type="text" id="person" name="person" placeholder="Enter person's name">

        <br><br>

        <label for="date">Date of Visit:</label><br>
        <input type="date" id="date" name="date" required>

        <br><br>

        <label for="time">Time of Visit:</label><br>
        <input type="time" id="time" name="time" required>

        <br><br>

        <button type="submit">Register Visitor</button>
        <button type="reset">Clear</button>

    </form>
<script src="../JS/form.js"></script>
</body>
</html>
