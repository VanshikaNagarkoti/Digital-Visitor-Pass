<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Map</title>

    <link rel="stylesheet" href="../CSS/map.css">

</head>

<body>

    <div class="map-container">

        <h1>My College</h1>

        <p class="subtitle">
            Find your desired location
        </p>


        <input
            type="text"
            class="search"
            placeholder="Search college location..."
        >


        <h2>College Locations</h2>


        <div class="locations">

            <button class="location">
                Block A
            </button>

            <button class="location">
                Block B
            </button>

            <button class="location">
                Library
            </button>

            <button class="location">
                Cafeteria
            </button>

            <button class="location">
                Main Gate
            </button>

            <button class="location">
                Parking
            </button>

        </div>


        <div class="navigation-buttons">

            <!-- Refreshes the map page -->

            <a href="map.html" class="new-location">
                New Location
            </a>


            <!-- Deletes generated pass and opens Thank You page -->
            <a
                href="thankyou.html"
                class="exit-button"
                onclick="localStorage.removeItem('visitorPass');"
            >
                Exit
            </a>

        </div>

    </div>

</body>

</html>
